# --- JVM ---
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# The system JDK on this machine is 26, which the Android build tools do not support.
# Pin the build to the JDK 21 that ships inside Android Studio. Change this path if you
# move Android Studio or install a standalone Temurin 21.
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ---
kotlin.code.style=official
